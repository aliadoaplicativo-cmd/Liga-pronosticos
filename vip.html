<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zona VIP | Aliado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f4f6f9; }
    .header-app { background: linear-gradient(135deg, #2a1b4e 0%, #110926 100%) !important; color: #d4ff00; padding: 2rem 0; border-bottom: 4px solid #d4ff00; }
    .match-card { background: white; margin-bottom: 15px; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #ffc107; }
    .score-input { width: 70px !important; text-align: center; font-weight: bold; font-size: 1.2rem; border: 2px solid #3f2b6e; }
    .top-banner { background-color: #ffffff; padding: 15px 0; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 3px solid #d4ff00; }
    .top-banner img { height: 60px; object-fit: contain; }
    .footer-empresa { background-color: #f8f9fa; text-align: center; padding: 30px 15px; margin-top: 60px; color: #3f2b6e; }
    .footer-logo { height: 50px; margin-bottom: 10px; object-fit: contain; }
  </style>
</head>
<body>
  <!-- BANNER SUPERIOR -->
  <div class="top-banner">
    <img src="anuncio.png" alt="Anuncio">
  </div>

  <div class="header-app text-center">
    <h2>⭐ Zona Exclusiva VIP</h2>
    <p class="text-white mb-0">Ingresa con tu nombre y clave asignada</p>
  </div>

  <!-- ZONA DE INGRESO VIP -->
  <div class="container mt-4 mb-5" style="max-width: 500px;" id="loginArea">
    <div class="card p-4 shadow-sm border-0 border-top border-warning border-4">
      <h5 class="mb-3 text-center fw-bold">Acceso Invitados VIP</h5>
      <input type="text" id="nombreVip" class="form-control mb-3" placeholder="Tu Nombre (Ej: Gustavo)">
      <input type="password" id="claveVip" class="form-control mb-3" placeholder="Tu Clave de acceso">
      <button class="btn btn-warning w-100 fw-bold text-dark" onclick="loginVIP()">Ingresar a Pronosticar</button>
    </div>
  </div>

  <!-- ZONA DE PARTIDOS VIP -->
  <div class="container mt-4 mb-5 d-none" style="max-width: 700px;" id="pronosticosArea">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm border-start border-4 border-warning">
      <h4 id="saludoUsuario" class="text-dark m-0 fw-bold">Hola</h4>
      <button class="btn btn-sm btn-outline-danger fw-bold" onclick="location.reload()">Salir</button>
    </div>

    <div id="partidosContainer"></div>

    <div class="text-center mt-4">
      <button id="btnGuardarPronosticos" class="btn btn-warning btn-lg fw-bold w-100 shadow-sm d-none text-dark" onclick="guardarPronosticosVIP()">
        💾 Guardar Mis Pronósticos VIP
      </button>
    </div>
  </div>

  <footer class="footer-empresa">
    <p class="mb-2 text-muted fw-bold" style="font-size: 0.85rem;">Desarrollado por:</p>
    <img src="logo2.png" alt="Aliado" class="footer-logo">
  </footer>

  <!-- CONEXIÓN DIRECTA A FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDl95kPyGtbK5_6PP7i-joBS7fXY2BLXYg",
      authDomain: "liga-pronosticos-aliado.firebaseapp.com",
      projectId: "liga-pronosticos-aliado",
      storageBucket: "liga-pronosticos-aliado.firebasestorage.app",
      messagingSenderId: "819793391221",
      appId: "1:819793391221:web:eb5cd4aa68938d9d13523c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let loggedVipId = null;

    // 1. Verificar Nombre y Clave en Firebase (Sin usar Excel)
    window.loginVIP = async () => {
      let nombreIn = document.getElementById('nombreVip').value.trim().toLowerCase();
      let claveIn = document.getElementById('claveVip').value.trim();
      if(!nombreIn || !claveIn) return Swal.fire('Atención', 'Ingresa tu nombre y clave', 'warning');

      Swal.fire({title: 'Verificando VIP...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
      try {
        const snap = await getDocs(collection(db, "usuarios"));
        let vipEncontrado = null;

        snap.forEach(d => {
          let u = d.data();
          if(u.rol === "VIP" && u.nombre && u.nombre.trim().toLowerCase() === nombreIn && String(u.clave).trim() === claveIn) {
            vipEncontrado = { id: d.id, ...u };
          }
        });

        if(!vipEncontrado) {
          return Swal.fire('Acceso Denegado', 'Nombre o clave VIP incorrectos.', 'error');
        }

        loggedVipId = vipEncontrado.id;
        document.getElementById('loginArea').classList.add('d-none');
        document.getElementById('pronosticosArea').classList.remove('d-none');
        document.getElementById('saludoUsuario').innerHTML = `⭐ Hola, ${vipEncontrado.nombre} <span class="badge bg-warning text-dark ms-2" style="font-size:0.8rem;">VIP</span>`;

        cargarPartidosVIP();
      } catch (err) {
        Swal.fire('Error', 'No se pudo verificar el acceso', 'error');
      }
    };

    // 2. Cargar Partidos desde Firebase
    async function cargarPartidosVIP() {
      document.getElementById('partidosContainer').innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-warning"></div><p>Cargando partidos...</p></div>';
      try {
        const querySnapshot = await getDocs(collection(db, "partidos"));
        let html = '';

        querySnapshot.forEach((docSnap) => {
          let p = docSnap.data();
          let disabled = p.bloqueado ? 'disabled' : '';
          let bloqueadoUI = p.bloqueado ? '<span class="badge bg-danger ms-2">Cerrado</span>' : '';

          html += `
          <div class="match-card">
            <div class="text-center text-muted small mb-2 fw-bold">${p.jornada} ${bloqueadoUI}</div>
            <div class="d-flex justify-content-between align-items-center">
              <div class="text-end fw-bold w-100" style="font-size: 1.1rem;">${p.local}</div>
              <div class="mx-3 d-flex align-items-center">
                <input type="number" id="loc_${p.id}" class="form-control score-input" min="0" ${disabled}>
                <span class="mx-2 fs-4 fw-bold text-muted">-</span>
                <input type="number" id="vis_${p.id}" class="form-control score-input" min="0" ${disabled}>
              </div>
              <div class="text-start fw-bold w-100" style="font-size: 1.1rem;">${p.visita}</div>
            </div>
          </div>`;
        });

        if (html === '') {
          document.getElementById('partidosContainer').innerHTML = '<div class="alert alert-info text-center">No hay partidos programados.</div>';
          Swal.close();
          return;
        }

        document.getElementById('partidosContainer').innerHTML = html;
        document.getElementById('btnGuardarPronosticos').classList.remove('d-none');

        await cargarMisPronosticosVIP();
        Swal.close();
      } catch (error) {
        document.getElementById('partidosContainer').innerHTML = '<div class="alert alert-danger">Error cargando partidos.</div>';
        Swal.close();
      }
    }

    // 3. Mostrar pronósticos previos del VIP
    async function cargarMisPronosticosVIP() {
      const pronosRef = collection(db, "usuarios", loggedVipId, "pronosticos");
      const qs = await getDocs(pronosRef);
      qs.forEach(d => {
        let data = d.data();
        let inLocal = document.getElementById('loc_' + d.id);
        let inVisita = document.getElementById('vis_' + d.id);
        if(inLocal && inVisita) {
          inLocal.value = data.golesLocal;
          inVisita.value = data.golesVisita;
        }
      });
    }

    // 4. Guardar pronósticos del VIP en Firebase
    window.guardarPronosticosVIP = async () => {
      Swal.fire({title: 'Guardando...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
      try {
        const querySnapshot = await getDocs(collection(db, "partidos"));
        let promesas = [];

        querySnapshot.forEach((docSnap) => {
          let p = docSnap.data();
          if(!p.bloqueado) {
            let gl = document.getElementById('loc_' + p.id).value;
            let gv = document.getElementById('vis_' + p.id).value;

            if(gl !== "" && gv !== "") {
              const docRef = doc(db, "usuarios", loggedVipId, "pronosticos", p.id);
              promesas.push(setDoc(docRef, {
                partidoId: p.id,
                golesLocal: parseInt(gl),
                golesVisita: parseInt(gv)
              }));
            }
          }
        });

        await Promise.all(promesas);
        Swal.fire('¡Guardado!', 'Tus pronósticos VIP han sido registrados.', 'success');
      } catch (e) {
        Swal.fire('Error', 'Hubo un problema al guardar', 'error');
      }
    };
  </script>
</body>
</html>
