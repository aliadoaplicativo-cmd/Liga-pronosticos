<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pronósticos al Público | Aliado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f4f6f9; }
    .header-app { background: linear-gradient(135deg, #3f2b6e 0%, #2a1b4e 100%) !important; color: white; padding: 2rem 0; }
    .match-card { background: white; margin-bottom: 15px; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #d4ff00;}
    .score-input { width: 70px !important; text-align: center; font-weight: bold; font-size: 1.2rem;}
    /* --- ESTILOS DE LA MARCA ALIADO --- */
    .top-banner { background-color: #ffffff; padding: 15px 0; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; z-index: 10; border-bottom: 3px solid #d4ff00; }
    .top-banner img { height: 60px; object-fit: contain; }
    .footer-empresa { background-color: #f8f9fa; text-align: center; padding: 30px 15px; margin-top: 60px; color: #3f2b6e; }
    .footer-logo { height: 50px; margin-bottom: 10px; object-fit: contain; }
    .btn-whatsapp { background-color: #25D366; color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(37,211,102,0.3); transition: transform 0.2s; }
    .btn-whatsapp:hover { transform: scale(1.05); color: white; }
  </style>
</head>
<body>
  <!-- BANNER SUPERIOR -->
  <div class="top-banner">
    <img src="anuncio.png" alt="Anuncio">
  </div>

  <div class="header-app text-center"><h2>👥 Pronósticos al Público</h2></div>
  
  <div class="container mt-4 mb-5" style="max-width: 700px;" id="loginArea">
    <div class="card p-4 shadow-sm border-0 border-top border-success border-4">
      <h5 class="mb-3">Ingreso / Registro</h5>
      <input type="email" id="emailPub" class="form-control mb-3" placeholder="Tu Correo Electrónico">
      <input type="password" id="passPub" class="form-control mb-3" placeholder="Tu Contraseña">
      
      <div class="d-flex gap-2">
         <button class="btn btn-primary w-50 fw-bold" onclick="loginPublico()">Ingresar</button>
         <button class="btn btn-outline-dark w-50" onclick="mostrarRegistro()">Nuevo Registro</button>
      </div>
      
      <div id="registroForm" class="d-none mt-4 border-top pt-3">
        <h6>Completa tus datos para registrarte:</h6>
        <input type="text" id="regNombre" class="form-control mb-2" placeholder="Tu Nombre Real (Privado)">
        <input type="text" id="regNick" class="form-control mb-2" placeholder="Nickname (El que verán todos)">
        <button class="btn btn-success w-100 mt-2" onclick="registrarPublico()">Crear mi Cuenta</button>
      </div>
    </div>
  </div>
  
  <div class="container mt-4 mb-5 d-none" style="max-width: 700px;" id="pronosticosArea">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 id="saludoUsuario" class="text-primary m-0">Hola</h4>
      <button class="btn btn-sm btn-outline-danger" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
    <div id="partidosContainer">
      <div class="alert alert-info text-center mt-4">
        <strong>¡Conexión exitosa a Firebase!</strong><br>Aún no hay partidos programados. El sistema está listo.
      </div>
    </div>
  </div>

  <!-- PIE DE PÁGINA -->
  <footer class="footer-empresa">
    <p class="mb-2 text-muted fw-bold" style="font-size: 0.85rem;">Desarrollado por:</p>
    <img src="logo2.png" alt="Aliado" class="footer-logo">
    <p class="mb-3" style="font-size: 0.85rem; color: #6c757d;">Plataformas Deportivas y Sistemas Web</p>
    <a href="https://wa.me/51993801594" target="_blank" class="btn-whatsapp">
      Escríbenos al 993 801 594
    </a>
  </footer>

  <!-- CONEXIÓN A FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

    // TUS LLAVES MAESTRAS DE ALIADO
    const firebaseConfig = {
      apiKey: "AIzaSyDl95kPyGtbK5_6PP7i-joBS7fXY2BLXYg",
      authDomain: "liga-pronosticos-aliado.firebaseapp.com",
      projectId: "liga-pronosticos-aliado",
      storageBucket: "liga-pronosticos-aliado.firebasestorage.app",
      messagingSenderId: "819793391221",
      appId: "1:819793391221:web:eb5cd4aa68938d9d13523c"
    };

    // Encendiendo los motores
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Variables globales
    let loggedUserId = null;

    // Funciones disponibles para los botones HTML
    window.mostrarRegistro = () => { document.getElementById('registroForm').classList.toggle('d-none'); };

    window.registrarPublico = async () => {
      let email = document.getElementById('emailPub').value;
      let pass = document.getElementById('passPub').value;
      let nombre = document.getElementById('regNombre').value;
      let nick = document.getElementById('regNick').value;
      
      if(!email || !pass || !nombre || !nick) return Swal.fire('Atención', 'Todos los campos son obligatorios', 'warning');
      if(pass.length < 6) return Swal.fire('Atención', 'La contraseña debe tener al menos 6 caracteres', 'warning');
      
      Swal.fire({title:'Creando cuenta segura...', allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
      
      try {
        // 1. Crear el usuario en la bóveda de Auth
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        const user = userCredential.user;

        // 2. Guardar sus datos en la Base de Datos (Firestore)
        await setDoc(doc(db, "usuarios", user.uid), {
          nombre: nombre,
          nick: nick,
          email: email,
          rol: "publico",
          fechaRegistro: new Date()
        });

        Swal.fire('¡Éxito!', 'Tu cuenta ha sido creada. Ya puedes ingresar.', 'success');
        document.getElementById('registroForm').classList.add('d-none');
      } catch (error) {
        let msg = error.code === 'auth/email-already-in-use' ? 'Este correo ya está registrado.' : error.message;
        Swal.fire('Error', msg, 'error');
      }
    };
    
    window.loginPublico = async () => {
      let email = document.getElementById('emailPub').value;
      let pass = document.getElementById('passPub').value;
      if(!email || !pass) return Swal.fire('Atención', 'Ingresa correo y contraseña', 'warning');
      Swal.fire({title:'Verificando...', allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
      
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
        const user = userCredential.user;

        // Extraer el nombre del usuario desde la base de datos
        const docSnap = await getDoc(doc(db, "usuarios", user.uid));
        if (docSnap.exists()) {
           iniciarSesionExitosa(user.uid, docSnap.data().nombre); 
        } else {
           Swal.fire('Error', 'Perfil de usuario no encontrado', 'error');
        }
      } catch (error) {
        Swal.fire('Error', 'Correo o contraseña incorrectos', 'error');
      }
    };
    
    function iniciarSesionExitosa(id, nombre) {
      loggedUserId = id;
      document.getElementById('loginArea').classList.add('d-none');
      document.getElementById('pronosticosArea').classList.remove('d-none');
      document.getElementById('saludoUsuario').innerText = '👋 Hola, ' + nombre;
      Swal.close();
      // Nota: La carga de partidos la activaremos en el siguiente paso.
    }

    window.cerrarSesion = async () => {
       await signOut(auth);
       location.reload();
    };
  </script>
</body>
</html>
