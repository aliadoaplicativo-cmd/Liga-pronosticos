<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pronósticos al Público | Aliado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f4f6f9; }
    .top-banner { background-color: #ffffff; padding: 15px 0; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 3px solid #d4ff00; }
    .top-banner img { height: 60px; object-fit: contain; }
    .header-app { background: linear-gradient(135deg, #3f2b6e 0%, #2a1b4e 100%) !important; color: white; padding: 2rem 0; border-bottom: 4px solid #d4ff00; }
    .match-card { background: white; margin-bottom: 15px; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #d4ff00; }
    .score-input { width: 70px !important; text-align: center; font-weight: bold; font-size: 1.2rem; border: 2px solid #3f2b6e; }
    .btn-google { background-color: #ffffff; color: #3c4043; border: 1px solid #dadce0; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s; }
    .btn-google:hover { background-color: #f8f9fa; border-color: #d2e3fc; }
    .divider { display: flex; align-items: center; text-align: center; color: #6c757d; font-size: 0.85rem; margin: 18px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #dee2e6; }
    .divider:not(:empty)::before { margin-right: .75em; }
    .divider:not(:empty)::after { margin-left: .75em; }
    .footer-empresa { background-color: #f8f9fa; text-align: center; padding: 30px 15px; margin-top: 60px; color: #3f2b6e; }
    .footer-logo { height: 50px; margin-bottom: 10px; object-fit: contain; }
  </style>
</head>
<body>
  <!-- BANNER SUPERIOR -->
  <div class="top-banner">
    <img src="anuncio.png" alt="Anuncio">
  </div>

  <div class="header-app text-center">
    <h2>👥 Pronósticos al Público</h2>
    <p class="mb-0 text-white-50">Demuestra cuánto sabes y suma puntos fecha a fecha</p>
  </div>

  <!-- ZONA DE LOGIN Y REGISTRO -->
  <div class="container mt-4 mb-5" style="max-width: 480px;" id="authArea">
    <div class="card p-4 shadow-sm border-0">
      
      <!-- BOTÓN RÁPIDO DE GOOGLE -->
      <button class="btn btn-google w-100 py-2 shadow-sm" onclick="ingresarConGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20" height="20">
        Continuar con Google
      </button>

      <div class="divider">o usa tu correo electrónico</div>

      <!-- PESTAÑAS INGRESAR / CREAR CUENTA -->
      <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-bold" id="tab-login" data-bs-toggle="pill" data-bs-target="#pane-login" type="button">Iniciar Sesión</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-bold" id="tab-registro" data-bs-toggle="pill" data-bs-target="#pane-registro" type="button">Crear Cuenta</button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- PESTAÑA 1: INICIAR SESIÓN -->
        <div class="tab-pane fade show active" id="pane-login">
          <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Tu Correo Electrónico">
          <input type="password" id="loginPass" class="form-control mb-3" placeholder="Tu Contraseña">
          <button class="btn btn-primary w-100 fw-bold py-2" onclick="iniciarSesionCorreo()">Ingresar a Pronosticar</button>
        </div>

        <!-- PESTAÑA 2: REGISTRO CON VERIFICACIÓN Y WHATSAPP -->
        <div class="tab-pane fade" id="pane-registro">
          <input type="text" id="regNombre" class="form-control mb-2" placeholder="Nombre y Apellido Real">
          <input type="text" id="regNick" class="form-control mb-2" placeholder="Nickname / Apodo (Se verá en la tabla)">
          <input type="tel" id="regCelular" class="form-control mb-2" placeholder="Celular / WhatsApp (Ej: 999888777)">
          <input type="email" id="regEmail" class="form-control mb-2" placeholder="Correo Electrónico Real">
          <input type="password" id="regPass" class="form-control mb-3" placeholder="Crea una Contraseña (mín. 6 caracteres)">
          <button class="btn btn-success w-100 fw-bold py-2" onclick="registrarConCorreo()">Crear mi Cuenta</button>
          <small class="text-muted d-block text-center mt-2" style="font-size: 0.78rem;">
            🔒 Te enviaremos un enlace a tu correo para verificar que es real.
          </small>
        </div>
      </div>

    </div>
  </div>

  <!-- ZONA DE PARTIDOS -->
  <div class="container mt-4 mb-5 d-none" style="max-width: 700px;" id="pronosticosArea">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm border-start border-4 border-primary">
      <h4 id="saludoUsuario" class="text-primary m-0 fw-bold">👋 Hola</h4>
      <button class="btn btn-sm btn-outline-danger fw-bold" onclick="cerrarSesion()">Salir</button>
    </div>

    <div id="partidosContainer"></div>

    <div class="text-center mt-4">
      <button id="btnGuardarPronosticos" class="btn btn-success btn-lg fw-bold w-100 shadow-sm d-none" onclick="guardarPronosticos()">
        💾 Guardar Mis Pronósticos
      </button>
    </div>
  </div>

  <footer class="footer-empresa">
    <p class="mb-2 text-muted fw-bold" style="font-size: 0.85rem;">Desarrollado por:</p>
    <img src="logo2.png" alt="Aliado" class="footer-logo">
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      sendEmailVerification, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDl95kPyGtbK5_6PP7i-joBS7fXY2BLXYg",
      authDomain: "liga-pronosticos-aliado.firebaseapp.com",
      projectId: "liga-pronosticos-aliado",
      storageBucket: "liga-pronosticos-aliado.firebasestorage.app",
      messagingSenderId: "819793391221",
      appId: "1:819793391221:web:eb5cd4aa68938d9d13523c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUserUid = null;

    // 1. INGRESO CON BOTÓN DE GOOGLE
    window.ingresarConGoogle = async () => {
      try {
        const res = await signInWithPopup(auth, googleProvider);
        const user = res.user;
        
        Swal.fire({title: 'Verificando perfil...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
        
        const userRef = doc(db, "usuarios", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          Swal.close();
          // Es usuario nuevo con Google: le pedimos su Nickname y WhatsApp
          const { value: formValues } = await Swal.fire({
            title: '¡Bienvenido! Completa tu perfil',
            html:
              `<p class="small text-muted mb-2">Para aparecer en la tabla y contactarte si ganas:</p>` +
              `<input id="swal-nick" class="swal2-input" placeholder="Tu Nickname / Apodo" value="${user.displayName || ''}">` +
              `<input id="swal-cel" type="tel" class="swal2-input" placeholder="Celular / WhatsApp">`,
            focusConfirm: false,
            allowOutsideClick: false,
            confirmButtonText: 'Guardar y Entrar',
            preConfirm: () => {
              const nick = document.getElementById('swal-nick').value.trim();
              const cel = document.getElementById('swal-cel').value.trim();
              if (!nick || !cel || cel.length < 9) {
                Swal.showValidationMessage('Por favor ingresa un Nickname y un número de WhatsApp válido');
                return false;
              }
              return { nick, cel };
            }
          });

          if (!formValues) {
            await signOut(auth);
            return;
          }

          await setDoc(userRef, {
            nombre: user.displayName || formValues.nick,
            nick: formValues.nick,
            celular: formValues.cel,
            email: user.email,
            rol: "publico",
            puntos: 0,
            exactos: 0,
            aciertosGanador: 0
          });

          entrarAPantallaPronosticos(user.uid, formValues.nick);
        } else {
          const data = userSnap.data();
          Swal.close();
          entrarAPantallaPronosticos(user.uid, data.nick || data.nombre);
        }
      } catch (err) {
        Swal.fire('Atención', 'No se completó el inicio con Google: ' + err.message, 'warning');
      }
    };

    // 2. REGISTRO MANUAL CON CORREO (ENVÍA LINK DE VERIFICACIÓN)
    window.registrarConCorreo = async () => {
      let nombre = document.getElementById('regNombre').value.trim();
      let nick = document.getElementById('regNick').value.trim();
      let celular = document.getElementById('regCelular').value.trim();
      let email = document.getElementById('regEmail').value.trim();
      let pass = document.getElementById('regPass').value;

      if (!nombre || !nick || !celular || !email || !pass) {
        return Swal.fire('Atención', 'Por favor completa todos los campos, incluyendo tu WhatsApp.', 'warning');
      }
      if (celular.length < 9) {
        return Swal.fire('Atención', 'Ingresa un número de Celular / WhatsApp válido.', 'warning');
      }

      Swal.fire({title: 'Creando cuenta...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        const user = cred.user;

        // Guardamos sus datos en Firestore (incluyendo celular)
        await setDoc(doc(db, "usuarios", user.uid), {
          nombre: nombre,
          nick: nick,
          celular: celular,
          email: email,
          rol: "publico",
          puntos: 0,
          exactos: 0,
          aciertosGanador: 0
        });

        // Enviamos correo de verificación obligatorio
        await sendEmailVerification(user);
        await signOut(auth);

        Swal.fire({
          icon: 'info',
          title: '¡Verifica tu Correo!',
          html: `Hemos enviado un enlace de confirmación a <b>${email}</b>.<br><br>Abre tu correo (revisa también la carpeta de <b>Spam o No deseados</b>), haz clic en el enlace y luego vuelve aquí para Iniciar Sesión.`,
          confirmButtonText: 'Entendido, ir a Iniciar Sesión'
        }).then(() => {
          document.getElementById('tab-login').click();
          document.getElementById('loginEmail').value = email;
        });

      } catch (err) {
        let msg = err.message;
        if (err.code === 'auth/email-already-in-use') msg = 'Este correo ya está registrado.';
        if (err.code === 'auth/weak-password') msg = 'La contraseña debe tener al menos 6 caracteres.';
        Swal.fire('Error', msg, 'error');
      }
    };

    // 3. INICIAR SESIÓN CON CORREO (COMPRUEBA QUE HAYA HECHO CLIC EN EL LINK)
    window.iniciarSesionCorreo = async () => {
      let email = document.getElementById('loginEmail').value.trim();
      let pass = document.getElementById('loginPass').value;
      if (!email || !pass) return Swal.fire('Atención', 'Ingresa tu correo y contraseña', 'warning');

      Swal.fire({title: 'Ingresando...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        const user = cred.user;

        // Si aún no ha verificado su correo real, no lo dejamos pasar
        if (!user.emailVerified) {
          const res = await Swal.fire({
            icon: 'warning',
            title: 'Correo no verificado',
            html: `Tu cuenta aún no está activada. Debes abrir el enlace que enviamos a <b>${email}</b> (revisa tu bandeja de Spam).`,
            showCancelButton: true,
            confirmButtonText: '📧 Reenviar correo de verificación',
            cancelButtonText: 'Cerrar'
          });

          if (res.isConfirmed) {
            await sendEmailVerification(user);
            Swal.fire('Enviado', 'Te hemos enviado un nuevo enlace de verificación.', 'success');
          }
          await signOut(auth);
          return;
        }

        const userSnap = await getDoc(doc(db, "usuarios", user.uid));
        let nickMostrar = userSnap.exists() ? (userSnap.data().nick || userSnap.data().nombre) : email;
        Swal.close();
        entrarAPantallaPronosticos(user.uid, nickMostrar);

      } catch (err) {
        Swal.fire('Acceso Denegado', 'Correo o contraseña incorrectos.', 'error');
      }
    };

    function entrarAPantallaPronosticos(uid, nick) {
      currentUserUid = uid;
      document.getElementById('authArea').classList.add('d-none');
      document.getElementById('pronosticosArea').classList.remove('d-none');
      document.getElementById('saludoUsuario').innerText = `👋 Hola, ${nick}`;
      cargarPartidos();
    }

    window.cerrarSesion = async () => {
      await signOut(auth);
      location.reload();
    };

    // 4. CARGAR PARTIDOS Y PRONÓSTICOS
    async function cargarPartidos() {
      document.getElementById('partidosContainer').innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-primary"></div><p>Cargando partidos...</p></div>';
      try {
        const querySnapshot = await getDocs(collection(db, "partidos"));
        let html = '';

        querySnapshot.forEach((docSnap) => {
          let p = docSnap.data();
          let disabled = p.bloqueado ? 'disabled' : '';
          let bloqueadoUI = p.bloqueado ? '<span class="badge bg-danger ms-2">Cerrado</span>' : '';

          html += `
          <div class="match-card">
            <div class="text-center text-muted small mb-2 fw-bold">${p.jornada} ${bloqueadoUI}</div>
            <div class="d-flex justify-content-between align-items-center">
              <div class="text-end fw-bold w-100" style="font-size: 1.1rem;">${p.local}</div>
              <div class="mx-3 d-flex align-items-center">
                <input type="number" id="loc_${p.id}" class="form-control score-input" min="0" ${disabled}>
                <span class="mx-2 fs-4 fw-bold text-muted">-</span>
                <input type="number" id="vis_${p.id}" class="form-control score-input" min="0" ${disabled}>
              </div>
              <div class="text-start fw-bold w-100" style="font-size: 1.1rem;">${p.visita}</div>
            </div>
          </div>`;
        });

        if (html === '') {
          document.getElementById('partidosContainer').innerHTML = '<div class="alert alert-info text-center">No hay partidos programados.</div>';
          return;
        }

        document.getElementById('partidosContainer').innerHTML = html;
        document.getElementById('btnGuardarPronosticos').classList.remove('d-none');

        const pronosRef = collection(db, "usuarios", currentUserUid, "pronosticos");
        const qs = await getDocs(pronosRef);
        qs.forEach(d => {
          let data = d.data();
          let inLocal = document.getElementById('loc_' + d.id);
          let inVisita = document.getElementById('vis_' + d.id);
          if (inLocal && inVisita) {
            inLocal.value = data.golesLocal;
            inVisita.value = data.golesVisita;
          }
        });
      } catch (error) {
        document.getElementById('partidosContainer').innerHTML = '<div class="alert alert-danger">Error cargando partidos.</div>';
      }
    }

    window.guardarPronosticos = async () => {
      Swal.fire({title: 'Guardando...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
      try {
        const querySnapshot = await getDocs(collection(db, "partidos"));
        let promesas = [];

        querySnapshot.forEach((docSnap) => {
          let p = docSnap.data();
          if (!p.bloqueado) {
            let gl = document.getElementById('loc_' + p.id).value;
            let gv = document.getElementById('vis_' + p.id).value;

            if (gl !== "" && gv !== "") {
              const docRef = doc(db, "usuarios", currentUserUid, "pronosticos", p.id);
              promesas.push(setDoc(docRef, {
                partidoId: p.id,
                golesLocal: parseInt(gl),
                golesVisita: parseInt(gv)
              }));
            }
          }
        });

        await Promise.all(promesas);
        Swal.fire('¡Guardado!', 'Tus pronósticos han sido registrados en la Nube.', 'success');
      } catch (e) {
        Swal.fire('Error', 'Hubo un problema al guardar', 'error');
      }
    };
  </script>
</body>
</html>
