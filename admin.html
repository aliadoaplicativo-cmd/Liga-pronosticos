<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Administrador | Aliado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f4f6f9; }
    .header-app { background: linear-gradient(135deg, #3f2b6e 0%, #2a1b4e 100%) !important; color: white; padding: 2rem 0; }
    .top-banner { background-color: #ffffff; padding: 15px 0; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; z-index: 10; border-bottom: 3px solid #d4ff00; }
    .top-banner img { height: 60px; object-fit: contain; }
    .footer-empresa { background-color: #f8f9fa; text-align: center; padding: 30px 15px; margin-top: 60px; color: #3f2b6e; }
    .footer-logo { height: 50px; margin-bottom: 10px; object-fit: contain; }
  </style>
</head>
<body>
  <!-- BANNER SUPERIOR -->
  <div class="top-banner">
    <img src="anuncio.png" alt="Anuncio">
  </div>

  <div class="header-app text-center"><h2>⚙️ Panel de Control Aliado</h2></div>
  
  <div class="container mt-5 text-center" style="max-width: 600px;">
    <div class="card p-5 shadow-sm border-0 border-top border-warning border-4">
      <h4 class="mb-4 text-dark fw-bold">Gestión de Base de Datos</h4>
      <p class="text-muted mb-4">Usa este botón cada vez que agregues nuevos partidos en tu Google Sheets para enviarlos a la aplicación de los usuarios.</p>
      
      <button class="btn btn-warning btn-lg fw-bold shadow-sm" onclick="sincronizarPartidos()">
        🔄 Sincronizar Partidos a Firebase
      </button>
    </div>
  </div>

  <!-- PIE DE PÁGINA -->
  <footer class="footer-empresa">
    <p class="mb-2 text-muted fw-bold" style="font-size: 0.85rem;">Desarrollado por:</p>
    <img src="logo2.png" alt="Aliado" class="footer-logo">
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

    // LLAVES DE ALIADO
    const firebaseConfig = {
      apiKey: "AIzaSyDl95kPyGtbK5_6PP7i-joBS7fXY2BLXYg",
      authDomain: "liga-pronosticos-aliado.firebaseapp.com",
      projectId: "liga-pronosticos-aliado",
      storageBucket: "liga-pronosticos-aliado.firebasestorage.app",
      messagingSenderId: "819793391221",
      appId: "1:819793391221:web:eb5cd4aa68938d9d13523c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // PEGA AQUÍ TU URL DE APPS SCRIPT (El que lee tu Excel)
    const SCRIPT_URL = "TU_URL_DE_APPS_SCRIPT_AQUI";

    async function callAPI(accion, params = {}) {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion: accion, params: params })
      });
      const json = await res.json();
      if (json.status === "error") throw new Error(json.message);
      return json.data;
    }

    window.sincronizarPartidos = async () => {
      Swal.fire({title: 'Leyendo Excel...', text: 'Obteniendo partidos...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
      
      try {
        // 1. Llama a tu Excel para traer los partidos
        const partidos = await callAPI("getPartidosParaJugadoresAPI");
        
        if(partidos.length === 0) {
            return Swal.fire('Atención', 'No hay partidos en el Excel para sincronizar.', 'warning');
        }

        Swal.fire({title: 'Subiendo a Firebase...', text: 'Actualizando plataforma...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});

        // 2. Guarda cada partido en Firestore
        const promesas = partidos.map(p => {
          const docRef = doc(db, "partidos", p.id);
          return setDoc(docRef, {
            id: p.id,
            jornada: p.jornada,
            local: p.local,
            visita: p.visita,
            bloqueado: p.bloqueado
          });
        });

        await Promise.all(promesas);

        Swal.fire('¡Éxito!', `Se sincronizaron ${partidos.length} partidos a la Nube correctamente.`, 'success');

      } catch (error) {
        Swal.fire('Error', error.message, 'error');
      }
    };
  </script>
</body>
</html>
