<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clasificación | Aliado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .top-banner { background-color: #ffffff; padding: 15px 0; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 3px solid #d4ff00; }
    .top-banner img { height: 60px; object-fit: contain; }
    .header-app { background: linear-gradient(135deg, #3f2b6e 0%, #2a1b4e 100%) !important; color: white; padding: 2rem 0; text-align: center;}
    .table-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: -30px; }
    .table thead { background-color: #1a1a1a; color: white; }
    .footer-empresa { background-color: #f8f9fa; text-align: center; padding: 30px 15px; margin-top: 60px; color: #3f2b6e; }
    .footer-logo { height: 50px; margin-bottom: 10px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="top-banner"><img src="anuncio.png" alt="Anuncio Aliado"></div>
  
  <div class="header-app">
    <h2>🏆 Liga de Pronósticos</h2>
    <p>Tabla de Clasificación General</p>
  </div>
  
  <div class="container mb-5" style="max-width: 800px;">
    <div class="table-container">
      
      <!-- Spinner de Carga -->
      <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted fw-bold">Calculando posiciones en tiempo real...</p>
      </div>
      
      <!-- Tabla de Posiciones -->
      <div class="table-responsive d-none" id="tableContent">
        <table class="table table-hover align-middle text-center mb-0">
          <thead>
            <tr>
              <th style="width: 15%">Pos</th>
              <th class="text-start" style="width: 60%">Participante</th>
              <th style="width: 25%">Puntos</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla">
            <!-- Los datos se inyectarán aquí -->
          </tbody>
        </table>
      </div>
      
    </div>
  </div>

  <footer class="footer-empresa">
    <p class="mb-2 text-muted fw-bold" style="font-size: 0.85rem;">Desarrollado por:</p>
    <img src="logo2.png" alt="Aliado" class="footer-logo">
  </footer>

  <!-- CONEXIÓN A FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDl95kPyGtbK5_6PP7i-joBS7fXY2BLXYg",
      authDomain: "liga-pronosticos-aliado.firebaseapp.com",
      projectId: "liga-pronosticos-aliado",
      storageBucket: "liga-pronosticos-aliado.firebasestorage.app",
      messagingSenderId: "819793391221",
      appId: "1:819793391221:web:eb5cd4aa68938d9d13523c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function cargarClasificacion() {
      try {
        // Ordena automáticamente a los usuarios de mayor a menor puntaje
        const q = query(collection(db, "usuarios"), orderBy("puntos", "desc"));
        const snapshot = await getDocs(q);
        
        let html = "";
        let pos = 1;
        
        snapshot.forEach(doc => {
          let u = doc.data();
          let puntos = u.puntos || 0; // Si no tiene puntos aún, muestra 0
          
          // Etiqueta visual si el usuario es VIP
          let etiquetaVIP = u.rol === 'VIP' ? '<span class="badge bg-warning text-dark ms-2" style="font-size:0.7rem;">VIP</span>' : '';
          
          html += `
          <tr>
            <td class="fw-bold fs-5 text-muted">${pos}</td>
            <td class="text-start fw-bold" style="font-size: 1.1rem;">
               ${u.nick || u.nombre} ${etiquetaVIP}
            </td>
            <td class="fw-bold text-primary" style="font-size: 1.3rem;">${puntos}</td>
          </tr>`;
          pos++;
        });

        if(html === "") {
            html = '<tr><td colspan="3" class="py-4 text-muted fw-bold">Aún no hay participantes registrados.</td></tr>';
        }

        document.getElementById('cuerpoTabla').innerHTML = html;
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('tableContent').classList.remove('d-none');
        
      } catch(err) {
         document.getElementById('loading').innerHTML = '<p class="text-danger fw-bold">Error cargando los datos del servidor.</p>';
      }
    }
    
    // Iniciar la carga al abrir la página
    cargarClasificacion();
  </script>
</body>
</html>
